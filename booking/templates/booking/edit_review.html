{% extends 'booking/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                <h4 class="fw-bold">Edit Your Review</h4>
                <p class="text-muted small">For Dr. {{ review.doctor.name }}</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Rating</label>
                        <select name="rating" class="form-select" required>
                            <option value="5" {% if review.rating == 5 %}selected{% endif %}>5 Stars - Excellent</option>
                            <option value="4" {% if review.rating == 4 %}selected{% endif %}>4 Stars - Very Good</option>
                            <option value="3" {% if review.rating == 3 %}selected{% endif %}>3 Stars - Average</option>
                            <option value="2" {% if review.rating == 2 %}selected{% endif %}>2 Stars - Poor</option>
                            <option value="1" {% if review.rating == 1 %}selected{% endif %}>1 Star - Terrible</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Your Comment</label>
                        <textarea name="comment" class="form-control" rows="4" required>{{ review.comment }}</textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold" style="background-color: #00a6a6; border: none;">Update Review</button>
                        <a href="{% url 'my_reviews' %}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
