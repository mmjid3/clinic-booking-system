{% extends 'booking/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                <h4 class="fw-bold"><i class="fas fa-star text-warning me-2"></i> Leave a Review</h4>
                <p class="text-muted small">How was your appointment with <strong>{{ appointment.staff.name }}</strong>?</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Rating</label>
                        {{ form.rating }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Your Comment</label>
                        {{ form.comment }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold" style="background-color: #00a6a6; border: none;">Submit Review</button>
                        <a href="{% url 'my_appointments' %}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
