{% extends 'booking/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                <h4 class="fw-bold"><i class="fas fa-user-edit me-2" style="color: #00a6a6;"></i> Edit Profile</h4>
                <p class="text-muted small">Update your personal information below.</p>
            </div>
            <div class="card-body p-4">
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-success small">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">First Name</label>
                        {{ form.first_name }}
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Last Name</label>
                        {{ form.last_name }}
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Email Address</label>
                        {{ form.email }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold" style="background-color: #00a6a6; border: none;">Save Changes</button>
                        <a href="{% url 'user_dashboard' %}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
