{% extends 'booking/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 text-center">
            <div class="card-body p-5">
                <div class="mb-4">
                    <i class="fas fa-trash-alt fa-4x text-danger"></i>
                </div>
                <h4 class="fw-bold mb-3">Delete Review?</h4>
                <p class="text-muted mb-4">Are you sure you want to delete your review for <strong>Dr. {{ review.doctor.name }}</strong>? This action cannot be undone.</p>
                
                <form method="post" class="d-grid gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger fw-bold">Yes, Delete It</button>
                    <a href="{% url 'my_reviews' %}" class="btn btn-light">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
