{% extends 'booking/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark">Welcome Back</h3>
                    <p class="text-muted small">Please enter your email and password to log in.</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger small">
                    Invalid email or password. Please try again.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" style="background-color: #00a6a6; border: none;">Log In</button>
                </form>
                
                <div class="text-center mt-4">
                    <small class="text-muted">Don't have an account? <a href="#" class="text-decoration-none" style="color: #00a6a6;">Sign up</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
